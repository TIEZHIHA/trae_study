<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="description" content="风热感冒多见于春夏季节，以发热重、咽喉红肿疼痛为主要表现。">
  <title>风热感冒（风热型感冒）- 离线样例页</title>
</head>
<body>
  <h1>风热感冒</h1>
  <p>别名：风热型感冒、热感冒</p>
  <p>简介：常见于春夏季节的外感证型，多因风热之邪犯表、肺气失和所致。</p>

  <h2>常用药物</h2>
  <ul>
    <li>银翘解毒片</li>
    <li>桑菊感冒片</li>
    <li>板蓝根颗粒</li>
  </ul>

  <h2>临床表现</h2>
  <ul>
    <li>发热重</li>
    <li>咽喉红肿疼痛</li>
    <li>鼻塞黄涕</li>
    <li>口渴喜饮</li>
  </ul>

  <h2>辅助检查</h2>
  <ul>
    <li>血常规</li>
    <li>C反应蛋白</li>
  </ul>

  <h2>预防措施</h2>
  <ul>
    <li>多饮温水</li>
    <li>饮食清淡</li>
    <li>保持室内通风</li>
  </ul>
</body>
</html>
