<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#123d6b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="医药问答" />
<title>医药问答 · 移动端</title>
<link rel="manifest" href="/mobile/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<style>
  :root{
    --bg:#f2f5fa; --card:#fff; --ink:#0f1b2d; --ink2:#4a5b70; --ink3:#8b98a8;
    --brand:#185FA5; --line:#e1e8f2; --ok:#0f9d6b; --warn:#c9821a;
    --danger:#c9384a; --violet:#6b4fc9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow-x:hidden}
  body{
    background:var(--bg);color:var(--ink);display:flex;flex-direction:column;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px;line-height:1.55;
  }
  .top{
    background:linear-gradient(135deg,#123d6b,#185FA5 55%,#12988f);
    color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;
    display:flex;align-items:center;gap:10px;flex:0 0 auto;
  }
  .logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.18);
    display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.3)}
  .top h1{font-size:16px;margin:0;font-weight:650}
  .top p{margin:1px 0 0;font-size:11px;opacity:.78}
  .pill-status{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:5px;opacity:.95}
  .dot{width:7px;height:7px;border-radius:50%;background:#8fe3c9}
  .dot.bad{background:#ffb4b4}

  main{flex:1 1 auto;min-width:0;overflow-y:auto;padding:14px 14px 6px;-webkit-overflow-scrolling:touch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 4px 14px rgba(16,32,52,.05);padding:13px;margin-bottom:12px;
    min-width:0;max-width:100%}
  .hint{font-size:11.5px;color:var(--ink3)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
  .chip{flex:0 0 auto;border:1px solid #d7e2ef;background:#f7fafd;color:var(--ink2);
    border-radius:999px;padding:6px 12px;font-size:12.5px}
  .chip:active{background:#eaf2fc}

  .pill{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.ok{color:#0a7a54;background:#e6f7f0}
  .pill.empty{color:#a26a06;background:#fdf3e0}
  .pill.clarify{color:#5c6b7d;background:#eff3f8}
  .pill.safety{color:#a82334;background:#fdecef}
  .pill.pending{color:#4f3aa8;background:#f0ecfd}
  .answer{font-size:15px;margin:10px 0 4px;white-space:pre-wrap}
  .meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .meta .k{font-size:10.5px;color:var(--ink3)}
  .meta .v{font-size:12.5px;font-weight:600;word-break:break-all}
  .path{font-size:11px;color:#0e4d7d;background:#f4f8fd;border-radius:8px;
    padding:6px 8px;margin-top:6px;overflow-x:auto;white-space:nowrap;max-width:100%}
  .bars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
  .bar{background:#f6f9fd;border-radius:8px;padding:6px 8px}
  .bar .l{font-size:10px;color:var(--ink3)}
  .bar .n{font-size:12.5px;font-weight:650;color:var(--brand)}
  .empty{color:var(--ink3);font-size:12.5px;padding:6px 0}

  .inputbar{
    flex:0 0 auto;display:flex;gap:8px;padding:8px 12px calc(10px + env(safe-area-inset-bottom));
    background:#fff;border-top:1px solid var(--line);
  }
  .inputbar input{
    flex:1;min-width:0;border:1px solid #cfdbea;border-radius:12px;padding:11px 13px;font-size:15px;
    outline:none;background:#fbfdff;
  }
  .inputbar input:focus{border-color:var(--brand)}
  .inputbar button{
    border:0;border-radius:12px;padding:0 18px;font-size:14.5px;font-weight:650;color:#fff;
    background:linear-gradient(135deg,#1a6bb8,#12988f);
  }
  .inputbar button:disabled{opacity:.55}
  a.web{display:block;text-align:center;color:var(--ink3);font-size:11.5px;
    text-decoration:none;padding:2px 0 10px}
</style>
</head>
<body>
  <div class="top">
    <div class="logo">KG</div>
    <div>
      <h1>医药知识图谱问答</h1>
      <p>移动端 · 与网页同一套 /ask 接口</p>
    </div>
    <div class="pill-status"><span class="dot" id="dot"></span><span id="healthText">连接中</span></div>
  </div>

  <main>
    <div class="card">
      <div class="hint" style="margin-bottom:8px">试试这些问题</div>
      <div class="chips" id="chips"><span class="empty">加载演示用例…</span></div>
    </div>

    <div class="card" id="answerCard">
      <div class="hint" id="answerHint">输入问题查看答案</div>
      <div class="empty" id="answerBody">答案、命中实体、证据路径与分段耗时都会显示在这里。</div>
    </div>

    <a class="web" href="/">切换到网页版 →</a>
  </main>

  <div class="inputbar">
    <input id="q" placeholder="例如：风热感冒吃什么药" autocomplete="off" />
    <button id="send">提问</button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const CN = { ok:"正常命中", empty:"无结果", clarify:"需澄清", safety:"高风险", pending:"待扩展" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pill = (s) => `<span class="pill ${CN[s] ? s : "clarify"}">${CN[s] || s}</span>`;

async function health(){
  try{
    const d = await (await fetch("/health")).json();
    $("dot").classList.remove("bad");
    $("healthText").textContent = "图谱 " + (d.components?.graph?.nodes ?? 0);
  }catch(e){
    $("dot").classList.add("bad"); $("healthText").textContent = "离线";
  }
}
async function cases(){
  try{
    const d = await (await fetch("/demo/cases")).json();
    $("chips").innerHTML = d.cases.map(c =>
      `<span class="chip" data-q="${esc(c.question)}">${esc(c.label)}</span>`).join("");
    $("chips").querySelectorAll(".chip").forEach(el => el.onclick = () => {
      $("q").value = el.dataset.q; ask();
    });
  }catch(e){ $("chips").innerHTML = '<span class="empty">用例加载失败</span>'; }
}
async function ask(){
  const q = $("q").value.trim();
  if (!q) return;
  $("send").disabled = true; $("answerHint").textContent = "查询中…";
  try{
    const res = await fetch("/ask", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:q})});
    const d = await res.json();
    if (!res.ok) throw new Error(d.error || "请求失败");
    render(d);
  }catch(e){
    $("answerHint").textContent = "请求失败";
    $("answerBody").innerHTML = pill("safety") + `<div class="answer">${esc(e.message)}</div>`;
  }finally{ $("send").disabled = false; }
}
function render(d){
  const t = d.timings || {};
  $("answerHint").textContent = `${d.status} · ${t.total ?? 0} ms`;
  const ev = (d.evidence || []).map(p => `<div class="path">${esc(p.path)}</div>`).join("");
  $("answerBody").innerHTML = `
    <div style="margin-top:6px">${pill(d.status)} <span class="hint" style="margin-left:6px">${esc(d.reason||"")}</span></div>
    <div class="answer">${esc(d.answer || "")}</div>
    <div class="meta">
      <div><div class="k">主实体</div><div class="v">${esc(d.entity || "—")}</div></div>
      <div><div class="k">意图</div><div class="v">${esc(d.intent_cn || d.intent || "—")}</div></div>
      <div><div class="k">NER 置信度</div><div class="v">${(d.confidence?.ner ?? 0).toFixed(2)}</div></div>
      <div><div class="k">意图置信度</div><div class="v">${(d.confidence?.intent ?? 0).toFixed(2)}</div></div>
    </div>
    ${ev ? `<div style="margin-top:10px"><div class="k hint">证据路径</div>${ev}</div>` : ""}
    <div class="bars">
      <div class="bar"><div class="l">模型</div><div class="n">${Number(t.model ?? 0).toFixed(2)}</div></div>
      <div class="bar"><div class="l">查询</div><div class="n">${Number(t.query ?? 0).toFixed(2)}</div></div>
      <div class="bar"><div class="l">总计</div><div class="n">${Number(t.total ?? 0).toFixed(2)}</div></div>
    </div>`;
}
$("send").onclick = ask;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") ask(); });
health(); cases(); setInterval(health, 30000);
const preset = new URLSearchParams(location.search).get("q");
if (preset){ $("q").value = preset; ask(); }
</script>
</body>
</html>
