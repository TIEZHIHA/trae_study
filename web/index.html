<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#185FA5" />
<title>医药知识图谱问答系统</title>
<link rel="manifest" href="/manifest.json" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<style>
  :root{
    --bg:#eef2f8;
    --card:#ffffff;
    --ink:#0f1b2d;
    --ink-2:#4a5b70;
    --ink-3:#8595a8;
    --line:#dde5ef;
    --brand:#185FA5;
    --brand-2:#12a594;
    --ok:#0f9d6b;
    --warn:#c9821a;
    --muted:#7c8a9c;
    --danger:#c9384a;
    --violet:#6b4fc9;
    --shadow:0 1px 2px rgba(16,32,52,.06),0 12px 28px rgba(16,32,52,.07);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1100px 420px at 12% -10%, #dbe8fa 0%, rgba(219,232,250,0) 62%),
      radial-gradient(900px 380px at 100% 0%, #d9f2ee 0%, rgba(217,242,238,0) 58%),
      var(--bg);
    color:var(--ink);
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
    line-height:1.6;
    min-height:100vh;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:22px 20px 56px}

  /* ---------- 顶栏 ---------- */
  header.top{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;padding:18px 22px;border-radius:var(--radius);
    background:linear-gradient(120deg,#123d6b 0%,#185FA5 46%,#12988f 100%);
    color:#fff;box-shadow:0 14px 30px rgba(18,63,107,.22);
  }
  .brand{display:flex;align-items:center;gap:14px;min-width:260px}
  .logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 auto;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
    display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:.5px;
  }
  .brand h1{margin:0;font-size:19px;font-weight:650;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:12.5px;color:rgba(255,255,255,.76)}
  .status{display:flex;align-items:center;gap:10px;font-size:12.5px;color:rgba(255,255,255,.9)}
  .dot{width:9px;height:9px;border-radius:50%;background:#8fe3c9;box-shadow:0 0 0 4px rgba(143,227,201,.22)}
  .dot.bad{background:#ffb4b4;box-shadow:0 0 0 4px rgba(255,180,180,.2)}
  .mono{font-family:"JetBrains Mono","Cascadia Mono",Consolas,monospace}

  /* ---------- 布局 ---------- */
  .grid{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:18px;margin-top:18px}
  @media (max-width:920px){ .grid{grid-template-columns:minmax(0,1fr)} }

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;
  }
  .card + .card{margin-top:16px}
  .card h2{
    margin:0 0 12px;font-size:14px;font-weight:650;color:var(--ink-2);
    letter-spacing:.4px;display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .hint{font-size:12px;color:var(--ink-3);font-weight:400;letter-spacing:0}

  /* ---------- 输入区 ---------- */
  .ask-row{display:flex;gap:10px;align-items:stretch}
  textarea{
    flex:1;min-height:76px;resize:vertical;padding:13px 14px;border-radius:11px;
    border:1px solid #c9d6e6;background:#fbfdff;color:var(--ink);font:inherit;font-size:15px;
    outline:none;transition:border-color .15s, box-shadow .15s;
  }
  textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(24,95,165,.12)}
  button{
    font:inherit;cursor:pointer;border-radius:11px;border:1px solid transparent;
    transition:transform .06s, filter .15s, background .15s;
  }
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{
    background:linear-gradient(135deg,#1a6bb8,#12988f);color:#fff;font-weight:600;
    padding:0 22px;font-size:14.5px;min-width:96px;
  }
  .btn-primary:hover{filter:brightness(1.05)}
  .btn-ghost{
    background:#f2f6fb;border-color:#d7e2ef;color:var(--ink-2);
    padding:7px 13px;font-size:12.5px;font-weight:600;
  }
  .btn-ghost:hover{background:#e9f1fa}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .chip{
    border:1px solid #d7e2ef;background:#f7fafd;color:var(--ink-2);border-radius:999px;
    padding:5px 12px;font-size:12.5px;cursor:pointer;transition:all .14s;
  }
  .chip:hover{border-color:var(--brand);color:var(--brand);background:#eef5fd}
  .chip small{color:var(--ink-3);margin-left:5px;font-size:11px}

  /* ---------- 答案 ---------- */
  .answer-empty{color:var(--ink-3);font-size:13.5px;padding:14px 2px}
  .pill{
    display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;
    font-size:11.5px;font-weight:700;letter-spacing:.4px;border:1px solid transparent;
  }
  .pill.ok{color:#0a7a54;background:#e6f7f0;border-color:#bfe9d8}
  .pill.empty{color:#a26a06;background:#fdf3e0;border-color:#f2ddb4}
  .pill.clarify{color:#5c6b7d;background:#eff3f8;border-color:#dbe4ee}
  .pill.safety{color:#a82334;background:#fdecef;border-color:#f6c9d1}
  .pill.pending{color:#4f3aa8;background:#f0ecfd;border-color:#d9d0f8}
  .answer-text{font-size:15.5px;color:var(--ink);margin:12px 0 2px;white-space:pre-wrap}
  .answer-text .em{color:var(--brand);font-weight:650}

  .meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
  @media (max-width:560px){ .meta{grid-template-columns:repeat(2,minmax(0,1fr))} }
  .meta .k{font-size:11px;color:var(--ink-3);letter-spacing:.3px}
  .meta .v{font-size:13.5px;color:var(--ink);font-weight:600;margin-top:2px;word-break:break-all}

  .evidence{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
  .evidence h3,.timing h3{margin:0 0 8px;font-size:12px;color:var(--ink-3);font-weight:600;letter-spacing:.4px}
  .path{
    display:block;font-size:12px;color:#0e4d7d;background:#f4f8fd;border:1px solid #e2ecf7;
    border-radius:8px;padding:7px 10px;margin-bottom:6px;overflow-x:auto;white-space:nowrap;
  }
  .path .src{color:var(--ink-3);font-size:11px}

  .timing{margin-top:14px}
  .bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
  .bar{background:#f6f9fd;border:1px solid #e6eef7;border-radius:9px;padding:8px 9px}
  .bar .l{font-size:10.5px;color:var(--ink-3)}
  .bar .n{font-size:13px;font-weight:650;color:var(--brand);margin-top:1px}

  /* ---------- 侧栏 ---------- */
  .stat-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat{
    flex:1 1 92px;background:#f7fafd;border:1px solid #e5eef8;border-radius:11px;padding:10px 12px;
  }
  .stat .n{font-size:19px;font-weight:700;color:var(--brand);line-height:1.25}
  .stat .l{font-size:11.5px;color:var(--ink-3)}
  .labels{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .lb{
    font-size:11.5px;color:#0e4d7d;background:#eef5fd;border:1px solid #dbe9f8;
    border-radius:999px;padding:3px 9px;
  }
  .lb b{font-weight:700}

  .rate{display:flex;align-items:flex-end;gap:10px;margin:4px 0 10px}
  .rate .big{font-size:32px;font-weight:750;line-height:1;color:var(--ok)}
  .rate .big.bad{color:var(--danger)}
  .rate .sub{font-size:12px;color:var(--ink-3);padding-bottom:4px}
  .kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed #eef2f7}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--ink-3)}
  .kv .v{color:var(--ink);font-weight:600;text-align:right;word-break:break-all}

  .logs{list-style:none;margin:0;padding:0;max-height:230px;overflow:auto}
  .logs li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dashed #eef2f7;font-size:12.5px}
  .logs li:last-child{border-bottom:0}
  .logs .q{flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logs .t{color:var(--ink-3);font-size:11px;flex:0 0 auto}
  .empty-note{font-size:12.5px;color:var(--ink-3);padding:6px 0}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);
    background:#0f1b2d;color:#fff;font-size:13px;padding:9px 16px;border-radius:10px;
    opacity:0;pointer-events:none;transition:.22s;z-index:9;max-width:86vw;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:22px;text-align:center;font-size:12px;color:var(--ink-3)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="logo">KG</div>
      <div>
        <h1>医药知识图谱问答系统</h1>
        <p>数据挖掘 → 知识图谱 → 智能问答　·　第 6 章实践案例</p>
      </div>
    </div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="healthText">正在连接服务…</span>
    </div>
  </header>

  <div class="grid">
    <!-- ================= 左：问答 ================= -->
    <section>
      <div class="card">
        <h2>提问 <span class="hint">回车发送，Shift+回车换行</span></h2>
        <div class="ask-row">
          <textarea id="q" placeholder="例如：风热感冒吃什么药 / 咳嗽怎么办 / 怎么预防失眠"></textarea>
          <button class="btn-primary" id="send">提问</button>
        </div>
        <div class="chips" id="chips"></div>
      </div>

      <div class="card" id="answerCard">
        <h2>答案 <span class="hint" id="answerHint">等待提问</span></h2>
        <div class="answer-empty" id="answerBody">输入问题后，这里会显示答案、命中实体、图谱证据路径与各阶段耗时。</div>
      </div>
    </section>

    <!-- ================= 右：知识库 / 验证 / 备份 ================= -->
    <aside>
      <div class="card">
        <h2>知识库 <button class="btn-ghost" id="syncBtn">同步 inbox</button></h2>
        <div class="stat-row">
          <div class="stat"><div class="n" id="sNodes">-</div><div class="l">节点</div></div>
          <div class="stat"><div class="n" id="sEdges">-</div><div class="l">关系</div></div>
          <div class="stat"><div class="n" id="sQb">-</div><div class="l">题库</div></div>
          <div class="stat"><div class="n" id="sDocs">-</div><div class="l">已入库文档</div></div>
        </div>
        <div class="labels" id="labels"></div>
      </div>

      <div class="card">
        <h2>题库回归 <button class="btn-ghost" id="regBtn">运行</button></h2>
        <div class="rate">
          <div class="big" id="regRate">--</div>
          <div class="sub" id="regSub">通过率 / 基线 95%</div>
        </div>
        <div id="regDetail"><div class="empty-note">题库由图谱自动生成，逐条执行后统计通过率。</div></div>
      </div>

      <div class="card">
        <h2>自动备份 <button class="btn-ghost" id="backupBtn">立即备份</button></h2>
        <div id="backupBox"><div class="empty-note">默认仅本地打包（dry run），推送需显式开启。</div></div>
      </div>

      <div class="card">
        <h2>最近问答 <span class="hint">qa_logs</span></h2>
        <ul class="logs" id="logs"><li class="empty-note">暂无记录</li></ul>
      </div>
    </aside>
  </div>

  <footer>答案均来自知识图谱既有记录，仅供健康科普参考，不能替代医生面诊与处方。</footer>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const STATUS_CN = { ok:"正常命中", empty:"无结果兜底", clarify:"低置信度澄清", safety:"高风险就医", pending:"待扩展意图" };

function toast(msg){
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pill(status){
  const s = STATUS_CN[status] ? status : "clarify";
  return `<span class="pill ${s}">${STATUS_CN[s] || status}</span>`;
}

/* ---------------- 健康状态 ---------------- */
async function loadHealth(){
  try{
    const r = await fetch("/health"); const d = await r.json();
    $("dot").classList.remove("bad");
    const bg = d.components?.graph || {};
    $("healthText").textContent = `服务正常 · 运行 ${d.uptime_sec}s · 图谱 ${bg.nodes ?? 0} 节点`;
    if (d.components?.graph) renderLabels(bg);
    $("sQb").textContent = d.questions ?? 0;
  }catch(e){
    $("dot").classList.add("bad");
    $("healthText").textContent = "服务连接失败";
  }
}

/* ---------------- 知识库统计 ---------------- */
function renderLabels(g){
  if (!g || !g.by_label) return;
  $("sNodes").textContent = g.nodes ?? 0;
  $("sEdges").textContent = g.edges ?? 0;
  const CN = { Disease:"疾病", Drug:"药物", Symptom:"症状", Check:"检查", Prevent:"预防" };
  $("labels").innerHTML = Object.entries(g.by_label)
    .map(([k,v]) => `<span class="lb">${CN[k] || k} <b>${v}</b></span>`).join("");
}
async function loadStats(){
  try{
    const d = await (await fetch("/admin/kb/stats")).json();
    renderLabels(d.graph);
    $("sQb").textContent = d.questions ?? 0;
    $("sDocs").textContent = d.docs_processed ?? 0;
  }catch(e){ /* 面板降级不影响问答 */ }
}

/* ---------------- 演示用例 ---------------- */
async function loadCases(){
  try{
    const d = await (await fetch("/demo/cases")).json();
    $("chips").innerHTML = d.cases.map(c =>
      `<span class="chip" data-q="${esc(c.question)}">${esc(c.label)}<small>${esc(c.question)}</small></span>`
    ).join("");
    $("chips").querySelectorAll(".chip").forEach(el => {
      el.addEventListener("click", () => {
        $("q").value = el.dataset.q;
        ask();
      });
    });
  }catch(e){ $("chips").innerHTML = '<span class="hint">演示用例加载失败</span>'; }
}

/* ---------------- 问答 ---------------- */
async function ask(){
  const q = $("q").value.trim();
  if (!q){ toast("请先输入问题"); $("q").focus(); return; }
  const btn = $("send"); btn.disabled = true; btn.textContent = "查询中";
  $("answerHint").textContent = "查询中…";
  try{
    const res = await fetch("/ask", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({question:q}),
    });
    const d = await res.json();
    if (!res.ok){ throw new Error(d.error || "请求失败"); }
    renderAnswer(d);
    loadLogs();
  }catch(e){
    $("answerHint").textContent = "请求失败";
    $("answerBody").innerHTML = `<span class="pill safety">错误</span>
      <div class="answer-text">${esc(e.message || "服务异常")}</div>`;
  }finally{
    btn.disabled = false; btn.textContent = "提问";
  }
}

function renderAnswer(d){
  $("answerHint").textContent = `${d.status} · ${d.timings?.total ?? 0} ms`;
  const c = d.confidence || {};
  const ent = (d.entities || []).map(e => `${e.name}(${e.label})`).join("、") || (d.entity || "未识别");

  const evidence = (d.evidence || []).length
    ? `<div class="evidence"><h3>图谱证据路径</h3>${d.evidence.map(p =>
        `<code class="path">${esc(p.path)} <span class="src">← ${esc(p.source)}</span></code>`).join("")}</div>`
    : `<div class="evidence"><h3>图谱证据路径</h3><div class="empty-note">本次未产生图路径（兜底分支）。</div></div>`;

  const t = d.timings || {};
  const timing = `<div class="timing"><h3>分段耗时（ms）</h3><div class="bars">
      ${bar("预处理", t.preprocess)}${bar("模型", t.model)}${bar("实体识别", t.ner)}
      ${bar("意图分类", t.intent)}${bar("图谱查询", t.query)}${bar("总计", t.total)}
    </div></div>`;

  $("answerBody").innerHTML = `
    <div>${pill(d.status)} <span class="hint" style="margin-left:8px">${esc(d.reason || "")}</span></div>
    <div class="answer-text">${esc(d.answer || "")}</div>
    <div class="meta">
      <div><div class="k">主实体</div><div class="v">${esc(d.entity || "—")}</div></div>
      <div><div class="k">意图</div><div class="v">${esc(d.intent_cn || d.intent || "—")}</div></div>
      <div><div class="k">NER 置信度</div><div class="v">${(c.ner ?? 0).toFixed(2)}</div></div>
      <div><div class="k">意图置信度</div><div class="v">${(c.intent ?? 0).toFixed(2)}</div></div>
    </div>
    <div class="evidence"><h3>命中实体</h3><div class="empty-note">${esc(ent)}</div></div>
    ${evidence}${timing}`;
}
function bar(label, v){
  return `<div class="bar"><div class="l">${label}</div><div class="n">${Number(v ?? 0).toFixed(2)}</div></div>`;
}

/* ---------------- 回归 ---------------- */
async function runRegression(silent){
  const btn = $("regBtn"); btn.disabled = true; btn.textContent = "运行中";
  $("regDetail").innerHTML = '<div class="empty-note">正在逐条执行题库…</div>';
  try{
    const d = await (await fetch("/admin/regression")).json();
    const ok = d.rate >= 95;
    $("regRate").textContent = `${d.rate}%`;
    $("regRate").className = "big" + (ok ? "" : " bad");
    $("regSub").textContent = `${d.passed}/${d.total} 条通过 · 基线 95%`;
    const fails = (d.details || []).filter(x => !x.pass).slice(0, 5);
    $("regDetail").innerHTML = fails.length
      ? fails.map(f => `<div class="kv"><span class="q">${esc(f.question)}</span><span class="v">${esc(f.status)}</span></div>`).join("")
      : '<div class="empty-note">全部通过。</div>';
    if (!silent) toast(ok ? "回归通过" : "回归未达标，见明细");
  }catch(e){
    if (!silent) toast("回归执行失败");
    $("regDetail").innerHTML = '<div class="empty-note">回归执行失败</div>';
  }finally{ btn.disabled = false; btn.textContent = "运行"; }
}

/* ---------------- 备份 ---------------- */
async function runBackup(){
  const btn = $("backupBtn"); btn.disabled = true; btn.textContent = "打包中";
  try{
    const d = await (await fetch("/admin/backup/run", {method:"POST",
      headers:{"Content-Type":"application/json"}, body: JSON.stringify({dry_run:true})})).json();
    $("backupBox").innerHTML = `
      <div class="kv"><span class="k">状态</span><span class="v">${esc(d.status)}</span></div>
      <div class="kv"><span class="k">时间</span><span class="v">${esc(d.time || "—")}</span></div>
      <div class="kv"><span class="k">文件数</span><span class="v">${d.files ?? 0}</span></div>
      <div class="kv"><span class="k">敏感命中</span><span class="v">${d.hits ?? 0}</span></div>
      <div class="kv"><span class="k">产物</span><span class="v">${esc(d.package || "—")}</span></div>`;
    toast(d.status === "blocked" ? "敏感信息命中，已中止" : "打包完成");
  }catch(e){
    toast("备份执行失败");
  }finally{ btn.disabled = false; btn.textContent = "立即备份"; }
}
async function loadBackupStatus(){
  try{
    const d = await (await fetch("/admin/backup/status")).json();
    if (d.status && d.status !== "never"){
      $("backupBox").innerHTML = `
        <div class="kv"><span class="k">上次状态</span><span class="v">${esc(d.status)}</span></div>
        <div class="kv"><span class="k">时间</span><span class="v">${esc(d.time || "—")}</span></div>
        <div class="kv"><span class="k">产物</span><span class="v">${esc(d.package || "—")}</span></div>`;
    }
  }catch(e){}
}

/* ---------------- 日志 ---------------- */
async function loadLogs(){
  try{
    const d = await (await fetch("/admin/logs?limit=12")).json();
    const rows = d.logs || [];
    $("logs").innerHTML = rows.length
      ? rows.map(r => `<li><span class="q">${esc(r.question)}</span>${pill(r.status)}<span class="t">${esc((r.created_at||"").slice(11))}</span></li>`).join("")
      : '<li class="empty-note">暂无记录</li>';
  }catch(e){}
}

/* ---------------- 同步 ---------------- */
async function syncKb(){
  const btn = $("syncBtn"); btn.disabled = true; btn.textContent = "同步中";
  try{
    const d = await (await fetch("/admin/kb/sync", {method:"POST"})).json();
    toast(`扫描 ${d.scanned} · 新增 ${d.added} · 跳过 ${d.skipped} · 新题 ${d.questions}`);
    await Promise.all([loadHealth(), loadStats()]);
  }catch(e){ toast("同步失败"); }
  finally{ btn.disabled = false; btn.textContent = "同步 inbox"; }
}

/* ---------------- 事件绑定 ---------------- */
$("send").addEventListener("click", ask);
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); ask(); }
});
$("regBtn").addEventListener("click", runRegression);
$("backupBtn").addEventListener("click", runBackup);
$("syncBtn").addEventListener("click", syncKb);

/* ---------------- 初始化 ---------------- */
(async function init(){
  await loadHealth();
  await Promise.all([loadStats(), loadCases(), loadBackupStatus(), loadLogs()]);
  runRegression(true);
  // 支持 /?q=问句 直接演示，便于截图与分享
  const preset = new URLSearchParams(location.search).get("q");
  if (preset){ $("q").value = preset; ask(); }
  setInterval(loadHealth, 30000);
})();
</script>
</body>
